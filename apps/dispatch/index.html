<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PushComm - Dispatch Console</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body style="background:#1a1d23;color:#fff;margin:0" class="antialiased">
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh">
        <div style="text-align:center">
          <div style="width:2rem;height:2rem;border:2px solid #e67e22;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto"></div>
          <p style="margin-top:1rem;color:#a0a0a0;font-size:0.875rem">Loading Dispatch Console...</p>
        </div>
      </div>
    </div>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh">
        <p style="color:#e74c3c;font-size:1rem">JavaScript is required to use PushComm Dispatch Console.</p>
      </div>
    </noscript>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
