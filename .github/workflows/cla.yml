name: CLA

# Requires every contributor to sign the CLA before their PR can merge.
# Signatures are stored as a JSON file in a SEPARATE PRIVATE repository, so
# contributor names and emails are not published in this public repo.
#
# One-time setup by the repo owner:
#   1. Create a private repo, e.g. pushcommdigital-gif/cla-signatures
#   2. Create a PAT with `repo` scope on that repo
#   3. Add it here as the secret CLA_SIGNATURES_TOKEN
# Until that secret exists this workflow is inert and PRs are not blocked.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Skip entirely when the storage token isn't configured yet.
    if: >
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      - name: Check for signature storage
        id: cfg
        run: |
          if [ -n "${{ secrets.CLA_SIGNATURES_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLA_SIGNATURES_TOKEN is not set — CLA check skipped."
          fi

      - name: CLA Assistant
        if: steps.cfg.outputs.ready == 'true'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'main'
          # Signature storage lives in a private repo — see the header note.
          remote-organization-name: pushcommdigital-gif
          remote-repository-name: cla-signatures
          # The owner holds the copyright and cannot license work to
          # themselves, so they are exempt. Note this also makes the signing
          # flow impossible to test from the owner's own account — verified
          # once on 2026-08-09 by removing them here temporarily (PR #7), which
          # is the only way to exercise it without a second GitHub account.
          allowlist: dependabot[bot],github-actions[bot],pushcommdigital-gif
          custom-notsigned-prcomment: >
            Thanks for this pull request!


            Before it can be merged, please read the
            [Contributor Licence Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by posting exactly this as a comment on **this** pull request:


            ```

            I have read the CLA Document and I hereby sign the CLA

            ```


            **In short:** you keep the copyright in your work, but you grant
            the project owner the right to ship it in the commercial add-on
            products as well as here under AGPL-3.0. That is what makes the
            open-core model work. Please do read it rather than pasting blindly —
            and if you'd rather not sign, that's completely fine: the issue and
            the discussion are still valuable, and reporting bugs needs no
            agreement at all.


            You only sign once; you won't be asked again.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed — thank you. :tada:'
          lock-pullrequest-aftermerge: false
